services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maintai
      POSTGRES_USER: maintai
      POSTGRES_PASSWORD: maintai
    ports:
      - "5433:5432"
    volumes:
      - maintai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintai -d maintai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://maintai:maintai@db:5432/maintai
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    volumes:
      - ./frontend/app.py:/app/app.py
    depends_on:
      - backend

volumes:
  maintai_postgres_data:
